[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "treequiz"
version = "0.1.0"
description = "Guess the secret leaf of any tree by its lowest common ancestor with your guesses"
readme = "README.md"
requires-python = ">=3.10"
# The engine is standard library only. Nothing in src/ needs a third-party
# package, so `pip install -e .` installs nothing else.
dependencies = []

[project.optional-dependencies]
# Only datagen/ talks to the network, and only some builders need more than
# urllib; see datagen/README.md.
test = ["pytest"]

[project.scripts]
treequiz = "treequiz.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/treequiz"]
