# Publishes the frontend to GitHub Pages. The game runs in the browser
# (frontend/src/engine/), so there is no server to deploy — only files. The
# tests run first, so a broken main never replaces a working site.
#
# Pages has to be switched on once for the repository, with the source set to
# GitHub Actions: `gh api -X POST repos/<owner>/TreeQuiz/pages -f build_type=workflow`.
name: Pages

on:
  # Manual only for now: Pages is off while the repo is private.
  workflow_dispatch:

# One deploy at a time, never cancelled mid-flight: a half-published site is
# worse than one a push behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Reading releases, for the trees kept in them.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm test -- --run
      # A tree too big for git keeps its files in a GitHub Release, which its
      # manifest names (`"release": "<tag>"`); the assets are named as the
      # files sit in datasets/<id>/. Fetched after the tests, which cover the
      # trees in git, and before the build, which hashes them into the site's
      # data/ and lists them in datasets.json. A tree that names a release and
      # does not get its tree.json fails the deploy rather than vanishing.
      - name: Fetch trees kept in releases
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for manifest in datasets/*/manifest.json; do
            dir=$(dirname "$manifest")
            tag=$(jq -r '.release // empty' "$manifest")
            if [ -z "$tag" ] || [ -f "$dir/tree.json" ]; then continue; fi
            echo "$dir: release $tag"
            gh release download "$tag" --repo "${{ github.repository }}" --dir "$dir" --pattern '*.json' --skip-existing
            test -f "$dir/tree.json"
            ls -l "$dir"
          done
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
