# Publishes the frontend to GitHub Pages. The game runs in the browser
# (frontend/src/engine/), so there is no server to deploy — only files. The
# tests run first, so a broken main never replaces a working site.
#
# Pages has to be switched on once for the repository, with the source set to
# GitHub Actions: `gh api -X POST repos/<owner>/TreeQuiz/pages -f build_type=workflow`.
name: Pages

on:
  # Manual only for now: Pages is off while the repo is private.
  workflow_dispatch:

# One deploy at a time, never cancelled mid-flight: a half-published site is
# worse than one a push behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
