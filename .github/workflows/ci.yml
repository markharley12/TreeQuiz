# Both suites on every push and pull request, which never touch the network:
# the datasets are committed, and the builders' tests use no downloads. The
# APK job below does, for Gradle and its Android dependencies, and for the
# trees kept in releases, which the app bundles.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor pyproject.toml declares, and the version developed on.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: python -m pytest -q
      # Every shipped dataset, through the same validator a builder runs.
      - run: treequiz validate --all

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm 11 writes the lockfile here, and Node 22's bundled npm 10 has
      # rejected one it wrote (TaxoQuiz, Sep 2026).
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --run
      - run: npm run build

  # The Android APK, so a change that breaks the native build fails here
  # rather than on the next machine to build it (TaxoQuiz's first APK left
  # generated JavaScript in android/ that failed lint, unnoticed). The APK is
  # an artifact on the run's page, signed with a fresh debug key each run, so
  # one will not install over another: uninstall the old app first.
  android:
    runs-on: ubuntu-latest
    # Reading releases: the app bundles every tree, animals' included.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            frontend/android/**/*.gradle*
            frontend/android/**/gradle-wrapper.properties
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@11
      - run: npm ci
      # The app bundles every tree, so the trees kept in releases are fetched
      # first, as the Pages workflow does; the app build fails without them.
      - name: Fetch trees kept in releases
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for manifest in datasets/*/manifest.json; do
            dir=$(dirname "$manifest")
            tag=$(jq -r '.release // empty' "$manifest")
            if [ -z "$tag" ] || [ -f "$dir/tree.json" ]; then continue; fi
            gh release download "$tag" --repo "${{ github.repository }}" --dir "$dir" --pattern '*.json' --skip-existing
          done
      # The runner image ships an Android SDK and sets $ANDROID_HOME, which
      # Gradle reads in place of the gitignored local.properties.
      - run: npm run android:apk
      - uses: actions/upload-artifact@v7
        with:
          name: treequiz-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
